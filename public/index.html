/* ===== js/core.js ===== */
/* =====================================================================
 * 核心：画布、素材、工具函数、游戏状态、主循环
 * ===================================================================== */
const TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const I = {};

// ---------- 工具 ----------
function E(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), 0, 0, TAU); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function rand(a, b) { return a + Math.random() * (b - a); }
// 椭圆射程判定（俯视斜角，纵向压扁）
function inRange(cx, cy, x, y, r) { return Math.hypot(x - cx, (y - cy) / 0.7) <= r; }

// ---------- 布局 ----------
let LAY;
function loadLayout() {
  LAY = JSON.parse(JSON.stringify(LAYOUT_DEFAULT));
  
  ENEMIES.zombie.size = ENEMIES.ghost.size = LAY.sizes.zombie;
  ENEMIES.king.size = Math.round(LAY.sizes.zombie * 1.7);
}
loadLayout();

// ---------- 路线工具 ----------
function routeLen(r) { let L = 0; for (let i = 1; i < r.length; i++) L += Math.hypot(r[i][0] - r[i - 1][0], r[i][1] - r[i - 1][1]); return L; }
function routeAt(r, d) {
  for (let i = 1; i < r.length; i++) {
    const l = Math.hypot(r[i][0] - r[i - 1][0], r[i][1] - r[i - 1][1]);
    if (d <= l) { const u = d / l; return [r[i - 1][0] + (r[i][0] - r[i - 1][0]) * u, r[i - 1][1] + (r[i][1] - r[i - 1][1]) * u, r[i][0] - r[i - 1][0], r[i][1] - r[i - 1][1]]; }
    d -= l;
  }
  const n = r.length - 1; return [r[n][0], r[n][1], 0, -1];
}

// ---------- 游戏状态 ----------
let G;
function newGame() {
  G = {
    state: 'title',          // title | pick | prep | wave | win | lose
    coins: ECONOMY.startCoins, lives: ECONOMY.lives,
    wave: 0,                 // 已开始的波数（1..10）
    prepT: ECONOMY.firstPrepTime,
    speed: 1, paused: false,
    spawn: [],               // 待出怪队列 {t, type, route}
    spawnT: 0,
    enemies: [], projs: [], fx: [], texts: [],
    slots: LAY.slots.map((p, i) => ({ i, x: p[0], y: p[1], tower: null, seed: Math.random() * 1000 })),
    hero: null,
    M: newMods(),
    picks: {},               // 每张卡已选次数
    streak: { fu: 0, lei: 0, pao: 0, wang: 0 },
    choice: null,            // 当前候选卡
    rerolled: false,
    menu: null,              // 打开的建造/塔菜单
    armed: null,             // 已选中待释放的法术
    kills: 0, leaked: 0, hallHit: 0, routeIx: 0,
    time: 0,                 // 游戏内时间（受暂停和倍速影响）
  };
}

// ---------- 主循环 ----------
let K = 1, OX = 0, OY = 0, lt = 0, NOW = 0, mouse = null;
function resize() {
  const d = Math.min(window.devicePixelRatio || 1, 2);
  const box = document.getElementById('stage').getBoundingClientRect();
  const s = Math.min(box.width / MW, box.height / MH);
  const w = MW * s, h = MH * s;
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  cv.width = Math.round(w * d); cv.height = Math.round(h * d);
  K = cv.width / MW;
}
function toMap(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * MW, (e.clientY - r.top) / r.height * MH]; }

function frame(now) {
  const t = now / 1000; const raw = Math.min(0.05, lt ? t - lt : 0); lt = t; NOW = t;
  const running = !G.paused && (G.state === 'prep' || G.state === 'wave');
  const dt = running ? raw * G.speed : 0;
  if (running) update(dt);
  updateFx(raw * (G.paused ? 0 : G.speed));
  render(t);
  requestAnimationFrame(frame);
}

function update(dt) {
  G.time += dt;
  if (G.state === 'prep') {
    G.prepT -= dt;
    if (G.prepT <= 0) startWave(false);
  }
  if (G.state === 'wave') updateSpawns(dt);
  updateEnemies(dt);
  updateHero(dt);
  updateTowers(dt);
  updateProjs(dt);
  if (G.state === 'wave' && !G.spawn.length && !G.enemies.some(e => !e.dead)) endWave();
}

function startWave(early) {
  if (early && G.prepT > 0) {
    const bonus = Math.round(Math.min(G.prepT, ECONOMY.prepTime) * ECONOMY.earlyCallPerSec);
    if (bonus > 0) { G.coins += bonus; floatText(MW / 2, MH - 90, '提前召唤 +' + bonus + ' 铜钱', '#f2c95a', 1.6); }
  }
  G.wave++;
  G.state = 'wave';
  sfx('wave');
  const W = WAVES[G.wave - 1];
  let t = 0;
  for (const [type, n, gap, route] of W.groups) {
    for (let k = 0; k < n; k++) {
      const r = route != null ? route : (type === 'king' ? 0 : (G.routeIx++ % LAY.routes.length));
      G.spawn.push({ t, type, route: r, hpScale: W.hpScale });
      t += gap;
    }
    t += 2;
  }
  G.spawnT = 0;
  floatText(MW / 2, 150, '第 ' + G.wave + ' 波', '#ffdf8a', 2.2, 44);
}

function endWave() {
  if (G.wave >= WAVES.length) { G.state = 'win'; sfx('win'); return; }
  const bonus = ECONOMY.waveBonusBase + ECONOMY.waveBonusPerWave * G.wave + G.M.waveCoins;
  G.coins += bonus;
  floatText(MW / 2, 150, '击退第 ' + G.wave + ' 波  +' + bonus + ' 铜钱', '#9fe08a', 2.2, 34);
  openCardPick();
}

function loseLife(n) {
  sfx('leak');
  G.lives -= n; G.leaked += n; G.hallHit = 1;
  if (G.lives <= 0) { G.lives = 0; G.state = 'lose'; sfx('lose'); }
}

function floatText(x, y, s, color, life, size) { G.texts.push({ x, y, s, color: color || '#fff', life: life || 1, t: 0, size: size || 18 }); }

function stars() { return G.lives >= 18 ? 3 : G.lives >= 10 ? 2 : 1; }

/* ===== js/audio.js ===== */
/* =====================================================================
 * 音效与背景音乐：全部用 WebAudio 实时合成，不引用任何外部音频文件
 * 入口：initAudio()（首次点击时初始化）、sfx(name)、toggleMute() / setMuted()
 * 背景音乐：68 BPM，D 羽调五声音阶（D F G A C），木鱼 + 锣 + 低音持续音
 * ===================================================================== */
let AC = null, MASTER = null, SFXG = null, MUSG = null, NOISE = null;
let AUDIO_MUTED = false, BGM_TIMER = null, BGM_NEXT = 0, BGM_STEP = 0;
const LAST_SFX = {};
const SFX_GAP = 0.05;          // 同一种音效 0.05 秒内只播一次，避免群死爆音
const BGM_BEAT = 60 / 68;      // 一拍时长

// ---------- 初始化 ----------
function noiseBuf() {
  if (NOISE) return NOISE;
  const n = Math.floor(AC.sampleRate * 0.6);
  NOISE = AC.createBuffer(1, n, AC.sampleRate);
  const d = NOISE.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return NOISE;
}

function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) return;
  AC = new C();
  MASTER = AC.createGain(); MASTER.gain.value = AUDIO_MUTED ? 0 : 0.9;
  MASTER.connect(AC.destination);
  SFXG = AC.createGain(); SFXG.gain.value = 0.8; SFXG.connect(MASTER);
  MUSG = AC.createGain(); MUSG.gain.value = 0.8; MUSG.connect(MASTER);
  if (AC.state === 'suspended') AC.resume();
  startBgm();
}

// 浏览器要求先有用户手势才能出声：第一次点击 / 触摸 / 按键时初始化
(function () {
  const unlock = () => initAudio();
  window.addEventListener('pointerdown', unlock);
  window.addEventListener('touchstart', unlock, { passive: true });
  window.addEventListener('keydown', unlock);
})();

// ---------- 基础合成 ----------
function tone(t, freq, dur, type, gain, to, dest, attack) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  if (to) o.frequency.exponentialRampToValueAtTime(Math.max(20, to), t + dur);
  const a = attack || 0.006;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain), t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || SFXG);
  o.start(t); o.stop(t + dur + 0.05);
}

function noise(t, dur, ftype, freq, q, gain, to, dest) {
  const s = AC.createBufferSource(); s.buffer = noiseBuf();
  const f = AC.createBiquadFilter();
  f.type = ftype || 'bandpass'; f.frequency.setValueAtTime(freq, t); f.Q.value = q || 1;
  if (to) f.frequency.exponentialRampToValueAtTime(Math.max(40, to), t + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain), t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(dest || SFXG);
  s.start(t); s.stop(t + dur + 0.05);
}

// ---------- 音效表 ----------
const SFX = {
  fu(t) {                       // 掷符：轻快「嗖」
    noise(t, 0.16, 'bandpass', 900, 1.4, 0.22, 3200);
    tone(t, 660, 0.12, 'triangle', 0.07, 1500);
  },
  lei(t) {                      // 雷击：电流噼啪
    noise(t, 0.05, 'highpass', 2800, 0.8, 0.32);
    noise(t + 0.05, 0.05, 'highpass', 4200, 0.8, 0.24);
    noise(t + 0.1, 0.1, 'bandpass', 1600, 0.9, 0.2);
    tone(t, 140, 0.16, 'square', 0.1, 60);
  },
  boom(t) {                     // 炮弹爆炸：低沉「砰」
    tone(t, 120, 0.42, 'sine', 0.5, 36);
    tone(t, 70, 0.5, 'triangle', 0.18, 30);
    noise(t, 0.34, 'lowpass', 1000, 0.9, 0.4, 120);
  },
  net(t) {                      // 符网张开
    noise(t, 0.24, 'bandpass', 2800, 2.4, 0.2, 900);
    tone(t, 880, 0.14, 'sine', 0.05);
    tone(t + 0.045, 1174.7, 0.14, 'sine', 0.045);
  },
  die(t) {                      // 怪物死亡
    tone(t, 320, 0.13, 'square', 0.1, 90);
    noise(t, 0.09, 'lowpass', 900, 1, 0.12);
  },
  build(t) {                    // 建塔
    tone(t, 190, 0.16, 'sine', 0.36, 70);
    tone(t + 0.02, 95, 0.2, 'triangle', 0.18, 45);
    noise(t, 0.04, 'bandpass', 2600, 3, 0.16);
  },
  up(t) {                       // 升级
    [587.33, 698.46, 880].forEach((f, i) => tone(t + i * 0.06, f, 0.18, 'triangle', 0.1, f * 1.01));
  },
  leak(t) {                     // 漏怪：低沉警示
    tone(t, 110, 0.55, 'sawtooth', 0.12, 54);
    tone(t + 0.22, 82, 0.5, 'sine', 0.16, 41);
  },
  card(t) {                     // 选卡
    tone(t, 880, 0.16, 'triangle', 0.12, 1174.66);
    tone(t + 0.04, 1174.66, 0.16, 'sine', 0.07);
  },
  wave(t) {                     // 新一波：锣
    [98, 147, 196, 262, 349, 466].forEach((f, i) => tone(t, f, 2.4 - i * 0.2, 'sine', 0.16 / (i + 1), null, null, 0.01));
    noise(t, 0.5, 'bandpass', 4000, 0.7, 0.05, 2400);
  },
  boss(t) {                     // 尸王出现：鼓
    tone(t, 95, 0.5, 'sine', 0.55, 42);
    noise(t, 0.06, 'lowpass', 600, 1, 0.35);
    tone(t + 0.22, 82, 0.45, 'sine', 0.3, 36);
  },
  win(t) {                      // 胜利
    [293.66, 349.23, 392, 440, 587.33].forEach((f, i) => tone(t + i * 0.13, f, 0.34, 'triangle', 0.12));
    tone(t + 0.66, 1174.66, 0.7, 'sine', 0.08);
  },
  lose(t) {                     // 失败
    [220, 196, 174.61, 146.83].forEach((f, i) => tone(t + i * 0.26, f, 0.5, 'triangle', 0.13));
    tone(t + 0.1, 73.42, 1.6, 'sine', 0.1, 55, null, 0.2);
  },
};

function sfx(name) {
  if (!AC || AUDIO_MUTED || AC.state !== 'running') return;
  const t = AC.currentTime;
  if (LAST_SFX[name] != null && t - LAST_SFX[name] < SFX_GAP) return;
  LAST_SFX[name] = t;
  const f = SFX[name];
  if (f) f(t + 0.005);
}

// ---------- 静音 ----------
function setMuted(on) {
  AUDIO_MUTED = !!on;
  if (MASTER) {
    const t = AC.currentTime;
    MASTER.gain.cancelScheduledValues(t);
    MASTER.gain.setTargetAtTime(AUDIO_MUTED ? 0 : 0.9, t, 0.02);
  }
  return AUDIO_MUTED;
}
function toggleMute() { return setMuted(!AUDIO_MUTED); }

// ---------- 背景音乐 ----------
// D 羽调五声：D F G A C（低八度做持续音，高八度做稀疏旋律）
const PENTA = [293.66, 349.23, 392, 440, 523.25];

function startBgm() {
  if (BGM_TIMER) return;
  BGM_NEXT = AC.currentTime + 0.15;
  BGM_STEP = 0;
  BGM_TIMER = setInterval(bgmTick, 90);
}

function bgmTick() {
  if (!AC) return;
  const now = AC.currentTime;
  if (BGM_NEXT < now) BGM_NEXT = now + 0.05;   // 切后台回来时不补播一大串
  while (BGM_NEXT < now + 0.4) { bgmBeat(BGM_STEP, BGM_NEXT); BGM_STEP++; BGM_NEXT += BGM_BEAT; }
}

function bgmBeat(i, t) {
  const b = i % 16;                            // 4 小节 × 4 拍循环
  // 低音持续音：每小节第一拍，慢起慢落
  if (b % 4 === 0) {
    tone(t, 73.42, 3.4, 'sine', 0.22, null, MUSG, 0.5);
    tone(t, 110, 3.2, 'triangle', 0.08, null, MUSG, 0.6);
  }
  // 木鱼：每两拍一下（反拍），轻
  if (b % 2 === 1) {
    noise(t, 0.03, 'bandpass', 2200, 4, 0.28, null, MUSG);
    tone(t, 1050, 0.03, 'sine', 0.12, null, MUSG);
  }
  // 锣：每两小节一次，留长尾
  if (b === 0 && (i / 16) % 2 === 0) {
    [98, 147, 196, 262].forEach((f, k) => tone(t, f, 2.8 - k * 0.4, 'sine', 0.2 / (k + 1), null, MUSG, 0.02));
  }
  // 稀疏旋律：每小节 1～2 个音，大量留白
  if (b === 6 || b === 10 || b === 14) {
    const n = PENTA[(i * 3 + b) % PENTA.length] / 2;
    tone(t, n, 1.6, 'triangle', 0.18, n * 0.99, MUSG, 0.04);
  }
}

/* ===== js/enemies.js ===== */
/* =====================================================================
 * 怪物：出怪、移动、受伤、绘制
 * ===================================================================== */
function updateSpawns(dt) {
  G.spawnT += dt;
  while (G.spawn.length && G.spawn[0].t <= G.spawnT) {
    const s = G.spawn.shift();
    spawnEnemy(s.type, s.route, s.hpScale);
  }
}

function spawnEnemy(type, route, hpScale) {
  const D = ENEMIES[type];
  if (type === 'king') sfx('boss');
  const hp = Math.round(D.hp * hpScale * G.M.enemyHp);
  const R = LAY.routes[route];
  G.enemies.push({
    type, D, route, d: 0, hp, max: hp, x: R[0][0], y: R[0][1], dx: -1, dy: 0,
    off: (Math.random() - 0.5) * (D.boss ? 4 : 18), ph: Math.random(),
    slow: 0, slowT: 0, stunT: 0, burn: 0, burnT: 0, hit: 0, dead: 0,
    blocked: false, acd: 0, lunge: 0,
  });
}

function resistOf(e, type) {
  if (type === 'phys') return clamp(e.D.armor + (e.type === 'ghost' ? G.M.ghostArmor : 0), 0, 0.9);
  return clamp(e.D.mres + (e.type === 'zombie' ? G.M.zombieMres : 0), 0, 0.9);
}

// 造成伤害（type: phys / magic）
function damage(e, base, type) {
  if (e.dead || e.hp <= 0) return 0;
  const mul = type === 'phys' ? G.M.physMul : G.M.magicMul;
  const amt = base * mul * (1 - resistOf(e, type));
  e.hp -= amt; e.hit = 1;
  if (e.hp <= 0) killEnemy(e);
  return amt;
}

function killEnemy(e) {
  if (e.dead) return;
  e.dead = 0.001; G.kills++;
  sfx('die');
  const c = e.D.bounty + G.M.killCoins;
  G.coins += c;
  floatText(e.x, e.y - e.D.size, '+' + c, '#f2c95a', 0.8, 14);
  if (G.hero) G.hero.eng = G.hero.eng.filter(z => z !== e);
}

function applySlow(e, s, t) { if (s >= e.slow || e.slowT <= 0) { e.slow = s; } e.slowT = Math.max(e.slowT, t); }
function applyStun(e, t) { if (!e.D.boss) e.stunT = Math.max(e.stunT, t); else e.stunT = Math.max(e.stunT, t * 0.3); }

function updateEnemies(dt) {
  for (let i = G.enemies.length - 1; i >= 0; i--) {
    const e = G.enemies[i];
    if (e.dead) { e.dead += dt; if (e.dead > 0.6) G.enemies.splice(i, 1); continue; }
    e.hit = Math.max(0, e.hit - dt * 4); e.lunge = Math.max(0, e.lunge - dt * 4);
    if (e.burnT > 0) { e.burnT -= dt; damage(e, e.burn * dt, 'phys'); if (e.dead) continue; }
    if (e.slowT > 0) { e.slowT -= dt; if (e.slowT <= 0) e.slow = 0; }
    if (e.stunT > 0) { e.stunT -= dt; continue; }
    // 被英雄拦住：原地和英雄对打
    if (e.blocked) {
      const h = G.hero;
      if (!h || h.dead || !h.eng.includes(e)) { e.blocked = false; }
      else {
        const k = h.eng.indexOf(e); const tx = h.x + h.side * 26, ty = h.y + (k ? 10 : -3);
        e.x += (tx - e.x) * Math.min(1, dt * 8); e.y += (ty - e.y) * Math.min(1, dt * 8);
        e.acd -= dt;
        if (e.acd <= 0) { e.acd = e.D.boss ? 1.6 : 1.3; e.lunge = 1; h.hp -= e.D.boss ? 40 : 9; h.hit = 1; }
        continue;
      }
    }
    const R = LAY.routes[e.route];
    const sp = e.D.speed * (1 - e.slow) * (1 - G.M.enemySlow);
    // 僵尸跳着走：腾空时快、落地时慢
    const cyc = ((G.time + e.ph * 2) * 1.8) % 1;
    const mv = e.D.hop ? (cyc > 0.1 && cyc < 0.9 ? 1.15 : 0.3) : 1;
    e.d += sp * mv * dt;
    const p = routeAt(R, e.d);
    const L = Math.hypot(p[2], p[3]) || 1;
    e.x = p[0] - p[3] / L * e.off; e.y = p[1] + p[2] / L * e.off * 0.6; e.dx = p[2]; e.dy = p[3];
    if (e.d >= routeLen(R)) { e.dead = 0.6; G.enemies.splice(i, 1); loseLife(e.D.leak); continue; }
    tryBlock(e);
  }
}

function drawEnemy(e) {
  const img = I[e.D.img], S = e.D.size;
  const fight = e.blocked && !e.dead;
  const cyc = ((G.time + e.ph * 2) * 1.8) % 1;
  let hop = e.D.hop && !fight && !e.stunT ? Math.sin(cyc * Math.PI) : 0;
  let sq = e.D.hop && !fight ? (cyc < 0.12 ? 1 - (0.12 - cyc) * 1.6 : 1) : 1;
  if (!e.D.hop) hop = 0.25 + 0.25 * Math.sin(NOW * 3 + e.ph * 6); // 幽魂飘浮
  if (fight) sq = 1 - 0.06 * Math.abs(Math.sin(NOW * 3 + e.ph * 6)) - e.lunge * 0.1;
  const h = S * sq, w = S * img.width / img.height * (2 - sq), lift = hop * S * 0.2;
  const flip = fight && G.hero ? G.hero.x < e.x : e.dx < 0;
  const a = e.dead ? Math.max(0, 1 - e.dead / 0.6) : (e.type === 'ghost' ? 0.85 : 1);
  E(e.x, e.y, w * 0.32, w * 0.1); ctx.fillStyle = `rgba(20,40,0,${0.3 * a})`; ctx.fill();
  ctx.save(); ctx.globalAlpha = a; ctx.translate(e.x + (fight ? (flip ? -1 : 1) * e.lunge * 6 : 0), e.y - lift);
  if (flip) ctx.scale(-1, 1); if (e.dead) ctx.rotate(e.dead * 1.2);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(img, -w / 2, -h + h * 0.08, w, h);
  if (e.hit > 0) { ctx.globalAlpha = e.hit * 0.7; ctx.filter = 'brightness(3)'; ctx.drawImage(img, -w / 2, -h + h * 0.08, w, h); ctx.filter = 'none'; }
  ctx.imageSmoothingEnabled = true; ctx.restore();
  // 状态提示
  if (!e.dead) {
    if (e.slowT > 0) { E(e.x, e.y, w * 0.38, w * 0.13); ctx.strokeStyle = 'rgba(140,220,255,.8)'; ctx.lineWidth = 2; ctx.stroke(); }
    if (e.stunT > 0) { ctx.fillStyle = '#ffe66b'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('✦', e.x + Math.sin(NOW * 8) * 6, e.y - h - 10); }
    if (e.burnT > 0) { E(e.x, e.y - h * 0.4, 4, 6); ctx.fillStyle = 'rgba(255,120,40,.7)'; ctx.fill(); }
    if (e.hp < e.max || e.D.boss) {
      const bw = e.D.boss ? 60 : 24, bx = e.x - bw / 2, by = e.y - lift - h - 6;
      ctx.fillStyle = '#2a1b12'; ctx.fillRect(bx - 1, by - 1, bw + 2, 5);
      ctx.fillStyle = '#c0392b'; ctx.fillRect(bx, by, bw, 3);
      ctx.fillStyle = e.D.boss ? '#f2c14e' : '#7ed957'; ctx.fillRect(bx, by, bw * Math.max(0, e.hp) / e.max, 3);
    }
  } else {
    ctx.save(); ctx.globalAlpha = a * 0.6; E(e.x, e.y - 20 - e.dead * 30, 8 + e.dead * 12, 6 + e.dead * 9); ctx.fillStyle = '#d8f0ff'; ctx.fill(); ctx.restore();
  }
}

/* ===== js/towers.js ===== */
/* =====================================================================
 * 塔：建造、升级、出售、突破、攻击、子弹、绘制
 * 塔对象：{ type, lv(1..3), adv(是否已突破), spent, cd, advCd }
 * ===================================================================== */
function costMul() { return Math.max(0.5, 1 - G.M.discount); }
function buildCost(type) { return Math.round(TOWERS[type].cost[0] * costMul()); }
function upCost(t) { return t.lv >= 3 ? null : Math.round(TOWERS[t.type].cost[t.lv] * costMul()); }
function advCost(t) { return Math.round(TOWERS[t.type].advanced.cost * costMul()); }
function canAdvance(t) { return t.lv === 3 && !t.adv && G.M.adv === t.type && !G.M.advUsed; }

function buildTower(slot, type) {
  const c = buildCost(type); if (G.coins < c || slot.tower) return false;
  G.coins -= c;
  slot.tower = { type, lv: 1, adv: false, spent: c, cd: 0.3, advCd: 6, build: 1 };
  sfx('build');
  return true;
}
function upgradeTower(slot) {
  const t = slot.tower, c = upCost(t); if (c == null || G.coins < c) return false;
  G.coins -= c; t.spent += c; t.lv++; t.build = 1; sfx('up'); return true;
}
function advanceTower(slot) {
  const t = slot.tower; if (!canAdvance(t)) return false;
  const c = advCost(t); if (G.coins < c) return false;
  G.coins -= c; t.spent += c; t.adv = true; t.build = 1; G.M.advUsed = true;
  floatText(slot.x, slot.y - 120, TOWERS[t.type].advanced.name + '！', '#ffd76a', 2, 26);
  return true;
}
function sellTower(slot) {
  const t = slot.tower; if (!t) return;
  G.coins += Math.round(t.spent * ECONOMY.sellRate);
  slot.tower = null;
}

// 计算塔的实际数值（叠加卡牌加成）
function towerStats(t) {
  const D = TOWERS[t.type], s = D.lv[t.lv - 1], M = G.M, k = t.type;
  const o = Object.assign({}, s);
  o.dmg = s.dmg * (1 + M.dmg[k]);
  o.interval = s.interval / (1 + M.rate[k]);
  o.range = s.range * (1 + M.range[k]);
  if (k === 'fu') { o.shots = s.shots + M.fuShots; if (t.adv) { o.dmg *= 1.3; o.multi = 3; } }
  if (k === 'lei') { o.chain = s.chain + M.leiChain; }
  if (k === 'pao') { o.splash = s.splash * (1 + M.splash); if (t.adv) { o.dmg *= 1.7; o.range += 30; } }
  if (k === 'wang') { o.slow = Math.min(0.8, s.slow + M.slow); if (t.adv) { o.slow = Math.max(o.slow, 0.6); o.stun = 0.25; } }
  return o;
}

function enemiesInRange(x, y, r) { return G.enemies.filter(e => !e.dead && inRange(x, y, e.x, e.y, r)); }
// 优先攻击走得最远的
function pickTarget(list) { let b = null; for (const e of list) if (!b || e.d > b.d) b = e; return b; }

function updateTowers(dt) {
  for (const s of G.slots) {
    const t = s.tower; if (!t || t.type === 'tavern') continue;
    t.build = Math.max(0, t.build - dt * 3);
    const st = towerStats(t);
    if (t.type === 'lei' && t.adv) {
      t.advCd -= dt;
      if (t.advCd <= 0) { t.advCd = 6; for (const e of enemiesInRange(s.x, s.y, st.range)) { boltFx(s.x, s.y - 110, e.x, e.y - 16); damage(e, st.dmg, 'magic'); } }
    }
    t.cd -= dt; if (t.cd > 0) continue;
    const list = enemiesInRange(s.x, s.y, st.range);
    if (!list.length) { t.cd = 0.1; continue; }
    t.cd = st.interval;
    attack(s, t, st, list);
    if (Math.random() < G.M.combo) setTimeout(() => { if (s.tower === t) { const l2 = enemiesInRange(s.x, s.y, st.range); if (l2.length) attack(s, t, st, l2); } }, 140 / G.speed);
  }
}

function attack(s, t, st, list) {
  const top = { x: s.x + 10, y: s.y - 100 };
  t.fire = 1;
  if (t.type !== 'pao') sfx(t.type === 'fu' ? 'fu' : t.type === 'lei' ? 'lei' : 'net');
  if (t.type === 'fu') {
    const targets = st.multi ? list.sort((a, b) => b.d - a.d).slice(0, st.multi) : [pickTarget(list)];
    for (const tg of targets) for (let k = 0; k < st.shots; k++) {
      const fl = 0.42 + Math.hypot(tg.x - top.x, tg.y - top.y) / 900;
      const fut = tg.blocked || tg.stunT > 0 ? [tg.x, tg.y] : routeAt(LAY.routes[tg.route], tg.d + tg.D.speed * fl);
      G.projs.push({ kind: 'fu', x0: top.x, y0: top.y, x1: fut[0] + k * 6, y1: fut[1] - 14, t: -k * 0.08, d: fl, a: 0, tr: [], z: tg, dmg: st.dmg });
    }
  } else if (t.type === 'pao') {
    const tg = pickTarget(list); const fl = 0.8;
    const fut = tg.blocked || tg.stunT > 0 ? [tg.x, tg.y] : routeAt(LAY.routes[tg.route], tg.d + tg.D.speed * (1 - tg.slow) * fl);
    G.projs.push({ kind: 'pao', x0: top.x, y0: top.y, x1: fut[0], y1: fut[1], t: 0, d: fl, tr: [], dmg: st.dmg, r: st.splash });
  } else if (t.type === 'lei') {
    let tg = pickTarget(list); const hit = [tg]; let from = top;
    for (let c = 0; c <= st.chain && tg; c++) {
      boltFx(from.x, from.y, tg.x, tg.y - 16);
      damage(tg, st.dmg * (c ? 0.7 : 1), 'magic');
      if (G.M.leiStun && Math.random() < G.M.leiStun) applyStun(tg, 1);
      from = { x: tg.x, y: tg.y - 16 };
      tg = G.enemies.filter(e => !e.dead && !hit.includes(e) && Math.hypot(e.x - from.x, e.y - from.y) < 110).sort((a, b) => Math.hypot(a.x - from.x, a.y - from.y) - Math.hypot(b.x - from.x, b.y - from.y))[0];
      if (tg) hit.push(tg);
    }
  } else if (t.type === 'wang') {
    G.fx.push({ kind: 'ring', x: s.x, y: s.y, r: st.range, t: 0, life: 0.45, color: '140,220,170' });
    for (const e of list) {
      damage(e, st.dmg, 'magic'); applySlow(e, st.slow, 1.3);
      if (st.stun && Math.random() < st.stun) applyStun(e, 1);
    }
  }
}

function boltFx(x0, y0, x1, y1) {
  const pts = [[x0, y0]]; const n = 6;
  for (let i = 1; i < n; i++) { const u = i / n; pts.push([x0 + (x1 - x0) * u + rand(-10, 10), y0 + (y1 - y0) * u + rand(-8, 8)]); }
  pts.push([x1, y1]);
  G.fx.push({ kind: 'bolt', pts, t: 0, life: 0.22 });
  G.fx.push({ kind: 'flash', x: x1, y: y1, t: 0, life: 0.25, r: 26, color: '170,200,255' });
}

function updateProjs(dt) {
  for (let i = G.projs.length - 1; i >= 0; i--) {
    const p = G.projs[i]; p.t += dt / p.d; if (p.t < 0) continue;
    const u = Math.min(1, p.t);
    const arc = p.kind === 'pao' ? 110 : 55;
    p.x = p.x0 + (p.x1 - p.x0) * u; p.y = p.y0 + (p.y1 - p.y0) * u - Math.sin(u * Math.PI) * arc;
    p.a = (p.a || 0) + dt * 14; p.tr.push([p.x, p.y]); if (p.tr.length > 10) p.tr.shift();
    if (u >= 1) {
      G.projs.splice(i, 1);
      if (p.kind === 'fu') {
        if (p.z && !p.z.dead) damage(p.z, p.dmg, 'phys');
        sparkFx(p.x, p.y, '255,226,120', 10);
      } else {
        for (const e of G.enemies) if (!e.dead && inRange(p.x1, p.y1, e.x, e.y, p.r)) {
          damage(e, p.dmg, 'phys');
          if (G.M.burn) { e.burn = G.M.burn; e.burnT = 3; }
        }
        G.fx.push({ kind: 'boom', x: p.x1, y: p.y1, r: p.r, t: 0, life: 0.45 });
        sparkFx(p.x1, p.y1, '255,150,70', 16);
        sfx('boom');
      }
    }
  }
}

function sparkFx(x, y, color, n) { for (let k = 0; k < n; k++) { const a = Math.random() * TAU, v = 30 + Math.random() * 90; G.fx.push({ kind: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v * 0.6 - 30, t: 0, life: 0.4 + Math.random() * 0.3, color }); } }

// ---------- 绘制 ----------
// 雷法/朱砂/符网塔暂用符塔图换色，等美术图到了在 src/ 放 tower_lei.png 等即可自动替换
const TOWER_TINT = { lei: 'hue-rotate(195deg) saturate(1.3)', pao: 'hue-rotate(-25deg) saturate(1.6) brightness(1.05)', wang: 'hue-rotate(85deg) saturate(0.9)' };
const TOWER_MARK = { lei: '雷', pao: '炮', wang: '网' };
function towerImg(type) { return I[TOWERS[type].img] || I.tower; }
function towerRect(s, type) {
  const img = type === 'tavern' ? null : towerImg(type);
  const w = LAY.sizes.tower, h = img ? w * img.height / img.width : w;
  return { x: s.x - w / 2, y: s.y + 0.09 * h - h, w, h };
}

function drawTower(s, hl) {
  const t = s.tower, r = towerRect(s, t.type), img = towerImg(t.type);
  const pop = 1 + t.build * 0.12;
  E(s.x, s.y + 4, r.w * 0.42, r.w * 0.14); ctx.fillStyle = 'rgba(20,40,0,.3)'; ctx.fill();
  ctx.save(); ctx.translate(s.x, s.y); ctx.scale(pop, 2 - pop); ctx.translate(-s.x, -s.y);
  const tint = I[TOWERS[t.type].img] ? '' : (TOWER_TINT[t.type] || '');
  if (hl || t.adv) { ctx.shadowColor = t.adv ? 'rgba(255,210,90,1)' : 'rgba(255,230,140,.95)'; ctx.shadowBlur = t.adv ? 22 : 14; }
  if (tint) ctx.filter = tint;
  ctx.drawImage(img, r.x, r.y, r.w, r.h);
  ctx.filter = 'none'; ctx.shadowBlur = 0; ctx.restore();
  // 占位标记（换上正式美术后可删）
  if (TOWER_MARK[t.type] && !I[TOWERS[t.type].img]) {
    const mx = s.x, my = r.y + r.h * 0.5;
    ctx.fillStyle = '#2a1b12'; ctx.fillRect(mx - 11, my - 11, 22, 22);
    ctx.fillStyle = t.type === 'lei' ? '#9fc4ff' : t.type === 'pao' ? '#ff7a5a' : '#9fe0b0'; ctx.fillRect(mx - 9, my - 9, 18, 18);
    ctx.fillStyle = '#2a1b12'; ctx.font = 'bold 14px "Noto Serif SC",serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(TOWER_MARK[t.type], mx, my + 1);
  }
  // 等级：像素小方块
  for (let k = 0; k < t.lv + (t.adv ? 1 : 0); k++) {
    const bx = s.x - (t.lv + (t.adv ? 1 : 0)) * 6 + k * 12 + 2, by = s.y + 12;
    ctx.fillStyle = '#2a1b12'; ctx.fillRect(bx - 1, by - 1, 10, 10);
    ctx.fillStyle = k >= 3 ? '#ffb02e' : '#f2d36b'; ctx.fillRect(bx, by, 8, 8);
  }
}

function drawProjs() {
  for (const p of G.projs) {
    if (p.t < 0 || p.x == null) continue;
    if (p.kind === 'fu') {
      p.tr.forEach((q, j) => { E(q[0], q[1], 0.8 + j * 0.3, 0.8 + j * 0.3); ctx.fillStyle = `rgba(255,228,120,${j / 20})`; ctx.fill(); });
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = '#f6d35e'; ctx.strokeStyle = '#3a2212'; ctx.lineWidth = 1.4; ctx.fillRect(-4, -6.5, 8, 13); ctx.strokeRect(-4, -6.5, 8, 13); ctx.strokeStyle = '#c62a1d'; ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(0, 4); ctx.stroke(); ctx.restore();
    } else {
      p.tr.forEach((q, j) => { E(q[0], q[1], 1 + j * 0.4, 1 + j * 0.4); ctx.fillStyle = `rgba(120,90,70,${j / 30})`; ctx.fill(); });
      E(p.x, p.y, 7, 7); ctx.fillStyle = '#c0301e'; ctx.fill(); ctx.strokeStyle = '#2a1b12'; ctx.lineWidth = 2; ctx.stroke();
      E(p.x - 2, p.y - 2, 2, 2); ctx.fillStyle = '#ff9a7a'; ctx.fill();
    }
  }
}

function updateFx(dt) {
  for (let i = G.fx.length - 1; i >= 0; i--) {
    const f = G.fx[i]; f.t += dt; if (f.t > f.life) { G.fx.splice(i, 1); continue; }
    if (f.kind === 'spark') { f.vy += 120 * dt; f.x += f.vx * dt; f.y += f.vy * dt; }
  }
  for (let i = G.texts.length - 1; i >= 0; i--) { const x = G.texts[i]; x.t += dt || 0.016; if (x.t > x.life) G.texts.splice(i, 1); }
  G.hallHit = Math.max(0, G.hallHit - (dt || 0.016) * 2.5);
}

function drawFx() {
  for (const f of G.fx) {
    const k = f.t / f.life, a = 1 - k;
    if (f.kind === 'spark') { ctx.fillStyle = `rgba(${f.color},${a})`; ctx.fillRect(f.x - 1.5, f.y - 1.5, 3, 3); }
    else if (f.kind === 'ring') { E(f.x, f.y, f.r * (0.3 + 0.7 * k), f.r * 0.7 * (0.3 + 0.7 * k)); ctx.strokeStyle = `rgba(${f.color},${a * 0.9})`; ctx.lineWidth = 3; ctx.stroke(); ctx.fillStyle = `rgba(${f.color},${a * 0.12})`; ctx.fill(); }
    else if (f.kind === 'boom') { E(f.x, f.y, f.r * (0.4 + 0.6 * k), f.r * 0.7 * (0.4 + 0.6 * k)); ctx.fillStyle = `rgba(255,${140 + 80 * a | 0},60,${a * 0.5})`; ctx.fill(); }
    else if (f.kind === 'flash') { const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r); g.addColorStop(0, `rgba(${f.color},${a})`); g.addColorStop(1, `rgba(${f.color},0)`); ctx.fillStyle = g; ctx.fillRect(f.x - f.r, f.y - f.r, 2 * f.r, 2 * f.r); }
    else if (f.kind === 'bolt') {
      ctx.save(); ctx.lineJoin = 'round'; ctx.strokeStyle = `rgba(150,190,255,${a})`; ctx.lineWidth = 6; ctx.beginPath(); f.pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke();
      ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
    }
    else if (f.kind === 'thunder') {
      const x = f.x, y = f.y; ctx.save(); ctx.strokeStyle = `rgba(200,220,255,${a})`; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(x + 10, y - 400); ctx.lineTo(x - 15, y - 220); ctx.lineTo(x + 12, y - 120); ctx.lineTo(x, y); ctx.stroke(); ctx.restore();
      E(x, y, f.r * (0.5 + 0.5 * k), f.r * 0.7 * (0.5 + 0.5 * k)); ctx.fillStyle = `rgba(170,200,255,${a * 0.4})`; ctx.fill();
    }
  }
}

/* ===== js/hero.js ===== */
/* =====================================================================
 * 英雄酒馆 + 道长
 * 酒馆是一种特殊的「塔」：slot.tower = { type:'tavern', lv, spent }
 * 道长守在离酒馆最近的路上，自动劈砍（物理单体）和撒符（法术范围）
 * ===================================================================== */
function tavernSlot() { return G.slots.find(s => s.tower && s.tower.type === 'tavern'); }
function tavernCost(lv) { return Math.round(TAVERN.cost[lv] * costMul()); }

function buildTavern(slot) {
  if (tavernSlot() || slot.tower) return false;
  const c = tavernCost(0); if (G.coins < c) return false;
  G.coins -= c;
  slot.tower = { type: 'tavern', lv: 1, spent: c, build: 1 };
  sfx('build');
  summonHero(slot);
  return true;
}
function upgradeTavern(slot) {
  const t = slot.tower; if (t.lv >= 3) return false;
  const c = tavernCost(t.lv); if (G.coins < c) return false;
  G.coins -= c; t.spent += c; t.lv++; t.build = 1;
  if (G.hero) { const st = TAVERN.hero[t.lv - 1]; G.hero.max = st.hp; if (!G.hero.dead) G.hero.hp = st.hp; }
  return true;
}
function sellTavern(slot) { G.coins += Math.round(slot.tower.spent * ECONOMY.sellRate); slot.tower = null; if (G.hero) for (const e of G.hero.eng) e.blocked = false; G.hero = null; }

// 守点：离酒馆最近的路线上的点
function rallyPoint(slot) {

  for (const R of LAY.routes) { const L = routeLen(R); for (let d = 0; d < L; d += 8) { const p = routeAt(R, d); const dd = Math.hypot(p[0] - slot.x, p[1] - slot.y); if (dd < bd) { bd = dd; best = p; } } }
  return { x: best[0], y: best[1] };
}

function summonHero(slot) {
  const st = TAVERN.hero[slot.tower.lv - 1], rp = rallyPoint(slot);
  G.hero = { slot, x: slot.x, y: slot.y, rx: rp.x, ry: rp.y, hp: st.hp, max: st.hp, side: 1, cd: 0.5, aoeCd: 3, atk: 0, hit: 0, dead: 0, eng: [], slash: 0, walk: 0 };
}

function tryBlock(e) {
  const h = G.hero; if (!h || h.dead || !e.D.blockable || e.blocked) return;
  if (h.eng.length >= TAVERN.block) return;
  if (Math.hypot(e.x - h.x, (e.y - h.y) * 1.5) < 34) { e.blocked = true; e.acd = 0.6; h.eng.push(e); }
}

function updateHero(dt) {
  const h = G.hero; if (!h) return;
  const st = TAVERN.hero[h.slot.tower.lv - 1];
  h.hit = Math.max(0, h.hit - dt * 4); h.atk = Math.max(0, h.atk - dt); h.slash = Math.max(0, h.slash - dt * 3);
  h.eng = h.eng.filter(e => !e.dead && G.enemies.includes(e));
  if (h.dead) { h.dead -= dt; if (h.dead <= 0) { h.dead = 0; h.hp = h.max; h.x = h.slot.x; h.y = h.slot.y; } return; }
  if (h.hp <= 0) { h.dead = TAVERN.respawn; for (const e of h.eng) e.blocked = false; h.eng = []; return; }
  // 走回守点
  const dx = h.rx - h.x, dy = h.ry - h.y, dd = Math.hypot(dx, dy);
  if (dd > 3 && !h.eng.length) { const v = Math.min(dd, 90 * dt); h.x += dx / dd * v; h.y += dy / dd * v; h.walk += dt * 10; if (Math.abs(dx) > 2) h.side = dx > 0 ? 1 : -1; }
  if (!h.eng.length) h.hp = Math.min(h.max, h.hp + TAVERN.regen * dt);
  const tg = h.eng[0]; if (tg) h.side = tg.x > h.x ? 1 : -1;
  // 劈砍
  h.cd -= dt;
  if (h.cd <= 0 && tg) { h.cd = st.interval; h.atk = 0.34; h.pending = tg; }
  if (h.pending && h.atk < 0.2) {
    const z = h.pending; h.pending = null; h.slash = 1;
    if (!z.dead) { damage(z, st.dmg, 'phys'); sparkFx(z.x, z.y - 16, '255,240,200', 8); }
  }
  // 撒符：朝附近最密集的敌人
  h.aoeCd -= dt;
  if (h.aoeCd <= 0) {
    const near = G.enemies.filter(e => !e.dead && Math.hypot(e.x - h.x, e.y - h.y) < 150);
    if (near.length) {
      h.aoeCd = st.aoeCd;
      let best = near[0], bn = 0;
      for (const a of near) { const n = near.filter(b => Math.hypot(a.x - b.x, a.y - b.y) < st.aoeR).length; if (n > bn) { bn = n; best = a; } }
      for (const e of near) if (Math.hypot(e.x - best.x, e.y - best.y) < st.aoeR) damage(e, st.aoeDmg, 'magic');
      G.fx.push({ kind: 'ring', x: best.x, y: best.y, r: st.aoeR, t: 0, life: 0.5, color: '255,220,110' });
      for (let k = 0; k < 8; k++) { const a = k / 8 * TAU; G.projs.push({ kind: 'fu', x0: h.x, y0: h.y - 30, x1: best.x + Math.cos(a) * st.aoeR * 0.6, y1: best.y + Math.sin(a) * st.aoeR * 0.35, t: 0, d: 0.35, a: 0, tr: [], z: null, dmg: 0 }); }
    } else h.aoeCd = 0.4;
  }
}

function drawHero() {
  const h = G.hero; if (!h) return;
  if (h.dead) {

  }

// 全局加成（卡牌效果都改这里）
function newMods() {
  const per = v => ({ fu: v, lei: v, pao: v, wang: v });
  return {
    dmg: per(0), rate: per(0), range: per(0),
    fuShots: 0, leiChain: 0, leiStun: 0, splash: 0, burn: 0, slow: 0,
    combo: 0, physMul: 1, magicMul: 1,
    adv: null, advUsed: false,
    spells: [],
    waveCoins: 0, discount: 0, killCoins: 0,
    enemySlow: 0, enemyHp: 1, ghostArmor: 0, zombieMres: 0,
  };
}

function cardAvailable(c, opening) {
  if ((G.picks[c.id] || 0) >= c.max) return false;
  if (c.kind === 'adv') { if (opening || G.M.adv || G.wave < 3) return false; }
  if (opening && c.kind === 'spell') return false;
  return true;
}

function drawCards(opening) {
  const W = rarityWeights(G.wave), RI = { g: 0, b: 1, o: 2 };
  const pool = CARDS.filter(c => cardAvailable(c, opening));
  const out = [];
  for (let n = 0; n < 3 && pool.length; n++) {
    const ws = pool.map(c => W[RI[c.rarity]] * (c.tower ? 1 + STREAK_BONUS * G.streak[c.tower] : 1) / (c.rarity === 'o' ? 4 : 1));
    let r = Math.random() * ws.reduce((a, b) => a + b, 0), k = 0;
    while (r > ws[k]) { r -= ws[k]; k++; }
    out.push(pool[k]); pool.splice(k, 1);
  }
  return out;
}

function openCardPick() {
  G.state = 'pick'; G.rerolled = false; G.menu = null; G.armed = null;
  G.choice = drawCards(G.wave === 0);
  G.pickAnim = 0;
}

function pickCard(c) {
  sfx('card');
  G.picks[c.id] = (G.picks[c.id] || 0) + 1;
  if (c.tower) G.streak[c.tower]++;
  c.apply(G.M, G);
  floatText(MW / 2, 150, '获得「' + c.name + '」', '#ffdf8a', 1.8, 30);
  G.choice = null;
  G.state = 'prep';
  G.prepT = G.wave === 0 ? ECONOMY.firstPrepTime : ECONOMY.prepTime;
}

function rerollCards() {
  if (G.rerolled || G.coins < ECONOMY.rerollCost) return;
  G.coins -= ECONOMY.rerollCost; G.rerolled = true;
  G.choice = drawCards(G.wave === 0); G.pickAnim = 0;
}

  const sp = G.M.spells[i]; if (!sp) return;
  if (sp === 'freeze') {
    for (const e of G.enemies) if (!e.dead) applyStun(e, 3);
    G.fx.push({ kind: 'ring', x: MW / 2, y: MH / 2, r: 900, t: 0, life: 0.7, color: '160,220,255' });
    G.M.spells.splice(i, 1); G.armed = null;

    for (const e of G.enemies) if (!e.dead && inRange(m[0], m[1], e.x, e.y, R)) damage(e, 220, 'magic');
    G.fx.push({ kind: 'thunder', x: m[0], y: m[1], r: R, t: 0, life: 0.5 });

function drawSlot(s, hl) {
  const w = LAY.sizes.slot, hh = w * 0.46, x = s.x, y = s.y;
  const R = k => { const v = Math.sin(s.seed * 12.9898 + k * 78.233) * 43758.5453; return v - Math.floor(v); };

  if (hl) { ctx.save(); ctx.shadowColor = 'rgba(255,225,120,1)'; ctx.shadowBlur = 18; blob(1.06, 0.16); ctx.fillStyle = 'rgba(255,230,140,.6)'; ctx.fill(); ctx.restore(); }
  blob(1.04, 0.16); ctx.fillStyle = '#6e8a3a'; ctx.fill();
  blob(1, 0.16); ctx.fillStyle = '#c99a52'; ctx.fill();
  blob(0.9, 0.12); ctx.fillStyle = '#dcb36a'; ctx.fill();

  const fx = x + w * 0.16, fy = y - hh * 0.05, ph = hl ? 6 : 2.6, amp = hl ? 1.6 : 1;
  ctx.strokeStyle = '#3a2a14'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx, fy - 30); ctx.stroke();
  ctx.strokeStyle = '#8a6a32'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx, fy - 30); ctx.stroke();

}

function drawHall() {
  const H = LAY.hall, img = I.hall, w = H.w, h = w * img.height / img.width, x = H.x - w / 2, y = H.y - 0.82 * h;
  E(H.x + 10, H.y + 14, w * 0.46, w * 0.13); ctx.fillStyle = 'rgba(20,40,0,.28)'; ctx.fill();
  if (G.hallHit > 0) { ctx.save(); ctx.shadowColor = `rgba(255,40,30,${G.hallHit})`; ctx.shadowBlur = 30; }
  ctx.drawImage(img, x, y, w, h); if (G.hallHit > 0) ctx.restore();

  ctx.save(); ctx.translate(px, py); ctx.transform(1, -0.18, 0, 1, 0, 0);
  ctx.font = Math.round(36 * k) + 'px "Ma Shan Zheng","KaiTi",serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillText('茅 山', 1, 1.5); ctx.fillStyle = '#f4c955'; ctx.fillText('茅 山', 0, 0); ctx.restore();
  const cx = x + w * (485 / 943), cy = y + h * (735 / 880);

}
function drawSmoke() { for (const f of G.fx) if (f.kind === 'smoke') { const k = f.t / f.life; E(f.x + Math.sin(f.t * 2) * 4, f.y - f.t * 14, 2 + f.t * 2.6, 2 + f.t * 2.6); ctx.fillStyle = `rgba(225,235,245,${0.4 * (1 - k) * Math.min(1, f.t * 3)})`; ctx.fill(); } }

function rangeRing(x, y, r, a) { E(x, y, r, r * 0.7); ctx.fillStyle = `rgba(255,226,130,${0.12 * a})`; ctx.fill(); ctx.setLineDash([8, 6]); ctx.lineWidth = 2; ctx.strokeStyle = `rgba(255,236,170,${0.85 * a})`; ctx.stroke(); ctx.setLineDash([]); }

function render(t) {
  ctx.setTransform(K, 0, 0, K, 0, 0);
  ctx.drawImage(I.map, 0, 0, MW, MH);
  const hov = G.state === 'prep' || G.state === 'wave' ? (mouse ? slotAt(mouse) : null) : null;
  const list = G.slots.map(s => ({ y: s.y, f: () => { if (!s.tower) drawSlot(s, hov === s || (G.menu && G.menu.slot === s)); else if (s.tower.type === 'tavern') drawTavern(s, hov === s); else drawTower(s, hov === s); } }));
  list.push({ y: LAY.hall.y, f: drawHall });
  for (const e of G.enemies) list.push({ y: e.y, f: () => drawEnemy(e) });
  if (G.hero) list.push({ y: G.hero.y, f: drawHero });
  list.sort((a, b) => a.y - b.y).forEach(o => o.f());
  drawSmoke(); drawProjs(); drawFx();
  // 射程预览
  const ms = G.menu && G.menu.slot;
  if (ms && ms.tower && ms.tower.type !== 'tavern') rangeRing(ms.x, ms.y, towerStats(ms.tower).range, 1);
  if (G.menu && G.menu.preview) rangeRing(ms.x, ms.y, TOWERS[G.menu.preview].lv[0].range * (1 + G.M.range[G.menu.preview]), 0.7);
  if (G.armed != null && mouse) { E(mouse[0], mouse[1], 95, 95 * 0.7); ctx.fillStyle = 'rgba(150,180,255,.18)'; ctx.fill(); ctx.strokeStyle = 'rgba(190,210,255,.9)'; ctx.lineWidth = 2; ctx.stroke(); }
  // 飘字
  for (const x of G.texts) { const k = x.t / x.life; ctx.globalAlpha = Math.min(1, (1 - k) * 2); ctx.font = x.size + 'px ' + FONT_T; ctx.textAlign = 'center'; ctx.lineWidth = Math.max(3, x.size / 6); ctx.strokeStyle = '#1a1410'; ctx.strokeText(x.s, x.x, x.y - k * 26); ctx.fillStyle = x.color; ctx.fillText(x.s, x.x, x.y - k * 26); }
  ctx.globalAlpha = 1;
  if (G.hallHit > 0) { ctx.fillStyle = `rgba(200,30,20,${G.hallHit * 0.16})`; ctx.fillRect(0, 0, MW, MH); }
  if (G.menu) drawMenu();
  if (G.state !== 'title') drawHUD();
  if (G.state === 'pick') drawCardPick();
  if (G.state === 'title') drawTitle();
  if (G.state === 'win' || G.state === 'lose') drawEnd();
  
}

// ---------- HUD ----------
const HUD = {
  mute: { x: MW - 216, y: 14, w: 62, h: 42 },
  speed: { x: MW - 148, y: 14, w: 62, h: 42 }, pause: { x: MW - 78, y: 14, w: 62, h: 42 },
  call: { x: MW / 2 - 140, y: MH - 70, w: 280, h: 52 },
};
function spellRect(i) { return { x: 20 + i * 70, y: MH - 82, w: 60, h: 64 }; }

function drawHUD() {
  ctx.save();
  ctx.fillStyle = 'rgba(26,20,16,.82)'; ctx.fillRect(14, 14, 380, 46); ctx.strokeStyle = '#6b5232'; ctx.lineWidth = 2; ctx.strokeRect(14, 14, 380, 46);
  ctx.font = '22px ' + FONT_T; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillStyle = '#ff6b5a'; ctx.fillText('魂', 26, 38); ctx.fillStyle = '#fff'; ctx.fillText(G.lives + '/' + ECONOMY.lives, 52, 38);
  ctx.fillStyle = '#f2c94a'; ctx.fillText('钱', 132, 38); ctx.fillStyle = '#fff'; ctx.fillText(Math.floor(G.coins), 158, 38);
  ctx.fillStyle = '#9fd8ff'; ctx.fillText('波', 252, 38); ctx.fillStyle = '#fff'; ctx.fillText(Math.max(G.wave, 0) + '/' + WAVES.length, 278, 38);
  ctx.restore();

    pixelButton(HUD.call, (G.wave === 0 ? '开战' : '召唤下一波') + '  ' + Math.ceil(G.prepT) + 's' + (bonus > 0 ? '  +' + bonus + '钱' : ''), '#8a2a1e', true, 21);
  }

    const r = spellRect(i), S = SPELL_INFO[sp], on = G.armed === i;
    ctx.fillStyle = '#1a1410'; ctx.fillRect(r.x, r.y + 3, r.w, r.h); ctx.fillStyle = on ? '#fff2b0' : '#f2d36b'; ctx.fillRect(r.x, r.y, r.w, r.h);

  if (G.paused) { ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, 0, MW, MH); ctx.font = '48px ' + FONT_T; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText('暂停', MW / 2, MH / 2); }
}

// ---------- 建造 / 塔菜单 ----------
function menuItems() {
  const m = G.menu, s = m.slot, items = [];
  if (!s.tower) {
    for (const k of ['fu', 'lei', 'pao', 'wang']) items.push({ id: k, label: TOWERS[k].name, cost: buildCost(k), kind: 'build' });
    if (!tavernSlot()) items.push({ id: 'tavern', label: '英雄酒馆', cost: tavernCost(0), kind: 'build' });
  } else if (s.tower.type === 'tavern') {
    const t = s.tower; if (t.lv < 3) items.push({ id: 'up', label: '升级酒馆', cost: tavernCost(t.lv), kind: 'up' }); else items.push({ id: 'max', label: '已满级', cost: null, kind: 'none' });
    items.push({ id: 'sell', label: '出售', cost: -Math.round(t.spent * ECONOMY.sellRate), kind: 'sell' });
  } else {
    const t = s.tower;
    if (t.lv < 3) items.push({ id: 'up', label: '升级', cost: upCost(t), kind: 'up' });
    else if (canAdvance(t)) items.push({ id: 'adv', label: TOWERS[t.type].advanced.name, cost: advCost(t), kind: 'up' });
    else items.push({ id: 'max', label: t.adv ? '已突破' : '已满级', cost: null, kind: 'none' });
    items.push({ id: 'sell', label: '出售', cost: -Math.round(t.spent * ECONOMY.sellRate), kind: 'sell' });
  }
  // 围绕空地排成一圈；靠近画面边缘时整体往里收
  const n = items.length, R = n > 3 ? 112 : 92;
  const cx = clamp(s.x, R + 40, MW - R - 40), cy = clamp(s.y - 40, R + 70, MH - R - 40);
  items.forEach((it, i) => {
    const a = n > 3 ? -Math.PI / 2 + i * TAU / n : -Math.PI / 2 + (i - (n - 1) / 2) * 1.0;
    it.x = cx + Math.cos(a) * R; it.y = cy + Math.sin(a) * R * 0.8; it.r = 32;
  });
  return items;
}
function itemIcon(it, x, y) {
  ctx.save(); ctx.imageSmoothingEnabled = false;
  if (TOWERS[it.id]) {
    const img = towerImg(it.id), w = 40, h = w * img.height / img.width;
    if (!I[TOWERS[it.id].img] && TOWER_TINT[it.id]) ctx.filter = TOWER_TINT[it.id];
    ctx.drawImage(img, x - w / 2, y - h * 0.62, w, h); ctx.filter = 'none';

  } else {
    const ch = { tavern: '酒', up: '升', adv: '破', sell: '卖', max: '满' }[it.id];
    ctx.font = '26px "Noto Serif SC",serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = it.id === 'sell' ? '#e8d7b0' : '#ffe08a'; ctx.fillText(ch, x, y);
  }
  ctx.restore();
}
function drawMenu() {
  const items = menuItems();
  for (const it of items) {
    const afford = it.cost == null || it.cost <= 0 || G.coins >= it.cost, hov = mouse && Math.hypot(mouse[0] - it.x, mouse[1] - it.y) < it.r;
    ctx.save();
    ctx.fillStyle = '#1a1410'; ctx.beginPath(); ctx.arc(it.x, it.y + 3, it.r, 0, TAU); ctx.fill();
    ctx.fillStyle = it.kind === 'sell' ? '#6b3a2a' : afford ? (hov ? '#7a5a34' : '#4a3a28') : '#3a3430';
    ctx.beginPath(); ctx.arc(it.x, it.y, it.r, 0, TAU); ctx.fill(); ctx.strokeStyle = afford ? '#f2c94a' : '#6a5a4a'; ctx.lineWidth = 3; ctx.stroke();
    if (!afford) ctx.globalAlpha = 0.5;
    itemIcon(it, it.x, it.y - 4);
    ctx.globalAlpha = 1; ctx.restore();
    ctx.font = '13px "Noto Serif SC",serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineWidth = 3; ctx.strokeStyle = '#1a1410';
    const label = it.cost == null ? it.label : it.cost < 0 ? it.label + ' +' + (-it.cost) : it.label + ' ' + it.cost;
    ctx.fillStyle = afford ? '#fff' : '#b0a090'; ctx.strokeText(label, it.x, it.y + it.r + 12); ctx.fillText(label, it.x, it.y + it.r + 12);
  }

  const s = G.menu.slot;
  if (s.tower) {
    const t = s.tower, name = t.type === 'tavern' ? TAVERN.name : (t.adv ? TOWERS[t.type].advanced.name : TOWERS[t.type].name);
    const info = name + '  Lv' + t.lv + (t.type !== 'tavern' ? '  ' + TOWERS[t.type].desc : '');
    ctx.font = '15px "Noto Serif SC",serif'; ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = '#1a1410'; ctx.fillStyle = '#ffe9b0';
    ctx.strokeText(info, s.x, s.y + 40); ctx.fillText(info, s.x, s.y + 40);
  }
}

// ---------- 开始 / 结算 ----------
const TITLE_BTN = { x: MW / 2 - 130, y: MH / 2 + 60, w: 260, h: 60 };
function drawTitle() {
  ctx.fillStyle = 'rgba(12,10,6,.55)'; ctx.fillRect(0, 0, MW, MH);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '86px "Ma Shan Zheng","KaiTi",serif'; ctx.lineWidth = 8; ctx.strokeStyle = '#1a1410'; ctx.fillStyle = '#f2c94a';
  ctx.strokeText('任家镇外', MW / 2, MH / 2 - 90); ctx.fillText('任家镇外', MW / 2, MH / 2 - 90);
  ctx.font = '22px ' + FONT_T; ctx.fillStyle = '#e9dcb8'; ctx.fillText('僵尸夜袭茅山 · 建塔守住主殿 · 每波选一张卡', MW / 2, MH / 2 - 10);
  pixelButton(TITLE_BTN, '开始守护', '#8a2a1e', true, 28);
}
function drawEnd() {
  ctx.fillStyle = 'rgba(12,10,6,.7)'; ctx.fillRect(0, 0, MW, MH);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const win = G.state === 'win';
  ctx.font = '72px "Ma Shan Zheng","KaiTi",serif'; ctx.lineWidth = 8; ctx.strokeStyle = '#1a1410'; ctx.fillStyle = win ? '#f2c94a' : '#e0553f';
  const title = win ? '守住了！' : '主殿失守';
  ctx.strokeText(title, MW / 2, MH / 2 - 120); ctx.fillText(title, MW / 2, MH / 2 - 120);
  if (win) { const n = stars(); for (let i = 0; i < 3; i++) { ctx.font = '60px sans-serif'; ctx.fillStyle = i < n ? '#ffd23f' : '#4a4038'; ctx.fillText('★', MW / 2 + (i - 1) * 76, MH / 2 - 30); } }
  ctx.font = '22px ' + FONT_T; ctx.fillStyle = '#e9dcb8';
  ctx.fillText((win ? '剩余阴气 ' + G.lives + '/' + ECONOMY.lives : '撑到第 ' + G.wave + ' 波') + '   ·   消灭 ' + G.kills + ' 只', MW / 2, MH / 2 + 30);
  pixelButton(TITLE_BTN, '再来一局', '#8a2a1e', true, 28);
}

// ---------- 点击 ----------
function onClick(m) {
  
  if (G.state === 'title') { if (hitR(m, TITLE_BTN)) { openCardPick(); } return; }
  if (G.state === 'win' || G.state === 'lose') { if (hitR(m, TITLE_BTN)) { newGame(); G.state = 'title'; openCardPick(); } return; }
  if (G.state === 'pick') {
    for (const r of cardRects()) if (hitR(m, r)) { pickCard(r.c); return; }
    if (hitR(m, rerollRect())) rerollCards();
    return;
  }
  if (hitR(m, HUD.mute)) { toggleMute(); return; }
  if (hitR(m, HUD.speed)) { G.speed = G.speed === 1 ? 2 : 1; return; }
  if (hitR(m, HUD.pause)) { G.paused = !G.paused; return; }
  if (G.paused) return;
  for (let i = 0; i < G.M.spells.length; i++) if (hitR(m, spellRect(i))) { useSpell(i); return; }
  if (G.armed != null) { useSpell(G.armed, m); return; }
  if (G.state === 'prep' && hitR(m, HUD.call)) { startWave(true); return; }
  if (G.menu) {
    const items = menuItems();
    for (const it of items) if (Math.hypot(m[0] - it.x, m[1] - it.y) < it.r) { menuAction(it); return; }
  }
  const s = slotAt(m);
  G.menu = s ? { slot: s } : null;
}
function menuAction(it) {
  const s = G.menu.slot; let ok = false;
  if (it.kind === 'build') ok = it.id === 'tavern' ? buildTavern(s) : buildTower(s, it.id);
  else if (it.id === 'up') ok = s.tower.type === 'tavern' ? upgradeTavern(s) : upgradeTower(s);
  else if (it.id === 'adv') ok = advanceTower(s);
  else if (it.id === 'sell') { s.tower.type === 'tavern' ? sellTavern(s) : sellTower(s); ok = true; }
  if (ok) G.menu = null; else if (it.cost > 0) floatText(it.x, it.y - 40, '铜钱不够', '#ff8a7a', 0.8, 16);
}
function onMove(m) {
  mouse = m;
  if (G.menu && G.menu.slot && !G.menu.slot.tower) {
    const it = menuItems().find(it => Math.hypot(m[0] - it.x, m[1] - it.y) < it.r && TOWERS[it.id]);
    G.menu.preview = it ? it.id : null;
  }
}

// ---------- 启动 ----------
function boot() {
  newGame();
  cv.addEventListener('pointerdown', e => { const m = toMap(e); onMove(m); onClick(m); });
  cv.addEventListener('pointermove', e => onMove(toMap(e)));
  cv.addEventListener('pointerleave', () => { mouse = null; });
  addEventListener('keydown', e => { if (e.code === 'Space' && (G.state === 'prep' || G.state === 'wave')) { G.paused = !G.paused; e.preventDefault(); } });
  addEventListener('resize', resize); resize();
  requestAnimationFrame(frame);
}
let loaded = 0; const names = Object.keys(IMG);
for (const k of names) { I[k] = new Image(); I[k].onload = I[k].onerror = () => { if (++loaded === names.length) { if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot); else boot(); } }; I[k].src = IMG[k]; }

</script>
