<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title><!--DEV-->任家镇塔防 开发版<!--/DEV--><!--REL-->任家镇外 · 塔防<!--/REL--></title>
<!--DEV--><meta name="robots" content="noindex"><!--/DEV-->
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@500;700&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
:root{--bg:#14110d;--fg:#f3e9cf;--acc:#e0b448;--dbg:#3fa7d6}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Serif SC",serif}
#stage{width:100vw;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{display:block;touch-action:none;-webkit-user-select:none;user-select:none}
#rotate{display:none;position:fixed;inset:0;background:var(--bg);color:var(--acc);font-size:22px;align-items:center;justify-content:center;text-align:center;z-index:9}
@media (orientation:portrait) and (max-width:700px){#rotate{display:flex}}
/*DEV*/
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:10px auto;padding:0 14px;max-width:1360px;align-items:center}
.bar label{display:flex;align-items:center;gap:6px;font-size:14px}
button{font-family:inherit;font-size:14px;background:#2f2b23;color:var(--fg);border:1px solid #4a4334;border-radius:8px;padding:7px 14px;cursor:pointer}
#dbgbtn.on{background:var(--dbg);border-color:var(--dbg);color:#fff}
#dbgbar{background:#14212a;border:1px solid #2c4a5c;border-radius:10px;padding:10px}
#info{font-family:monospace;font-size:13px;color:#cfe8f5;min-width:200px}
textarea{width:100%;box-sizing:border-box;height:100px;background:#0e1519;color:#cfe8f5;border:1px solid #2c4a5c;border-radius:8px;font-family:monospace;font-size:12px;padding:8px}
.devtag{background:var(--dbg);color:#fff;padding:2px 10px;border-radius:6px;font-size:14px}
[hidden]{display:none!important}
/*/DEV*/
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="rotate">请把手机横过来玩</div>
<!--DEV-->
<div class="bar"><span class="devtag">开发版 · 仅供调试</span><button id="dbgbtn">调试模式</button>
<button id="cheatCoins">+500 铜钱</button><button id="cheatSkip">清空本波</button><button id="cheatCard">立即选卡</button>
<label>僵尸 <input id="zh" type="range" min="20" max="70" step="2"> <span id="zhv"></span></label>
<label>道长 <input id="hh" type="range" min="30" max="90" step="2"> <span id="hhv"></span></label>
<label>塔 <input id="tw" type="range" min="70" max="170" step="2"> <span id="twv"></span></label>
<label>空地 <input id="sw" type="range" min="40" max="140" step="2"> <span id="swv"></span></label>
<label>主殿 <input id="hw" type="range" min="200" max="460" step="5"> <span id="hwv"></span></label>
</div>
<div id="dbgbar" class="bar" hidden>
<button id="addSlot">新增空地</button><button id="delSel">删除选中</button><button id="addPt">选中路线点后插入新点</button>
<button id="export">导出布局</button><button id="import">导入布局</button><button id="reset">恢复默认</button>
<span id="info">点选或拖动：主殿 / 空地 / 路线点</span>
<textarea id="io" hidden placeholder="导出的布局会显示在这里，复制发给 Claude；或者粘贴布局后点「导入布局」"></textarea>
</div>
<!--/DEV-->
<script>
/*ASSETS*/
/*SCRIPTS*/
</script>
</body>
</html>
